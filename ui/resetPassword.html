<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Valigo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/resetPassword.css">
    <link rel="stylesheet" href="components/header/header.css">
    <link rel="stylesheet" href="components/footer/footer.css">
    <script src="components/header/header.js"></script>
    <script src="components/footer/footer.js"></script>
    <script src="js/resetPassword.js" defer></script>
  </head>
  <body>
    <site-header></site-header>
    <main id="noiDung" class="auth">
      <div class="container">
        <nav class="crumbs" aria-label="Đường dẫn">
          <a href="index.html">Trang chủ</a>
          <span aria-hidden="true">/</span>
          <a href="login.html">Đăng nhập</a>
          <span aria-hidden="true">/</span>
          <span aria-current="page">Đặt lại mật khẩu</span>
        </nav>

        <div class="authTicket">
          <section class="authMain" aria-labelledby="pageTitle">
            <h1 id="pageTitle" class="authTitle">Đặt lại mật khẩu</h1>
            <p class="authSub">Tạo mật khẩu mới cho tài khoản của bạn.</p>

            <form class="form" action="login.html">
              <div class="field">
                <label class="fieldLabel" for="newPassword">Mật khẩu mới</label>
                <div class="inputWrap">
                  <input id="newPassword" class="input" type="password" required minlength="8" autocomplete="new-password" placeholder="Tạo mật khẩu mới" aria-describedby="newPasswordError">
                  <button type="button" class="eyeBtn" aria-controls="newPassword" aria-pressed="false" aria-label="Hiện mật khẩu">
                    <svg class="icon eyeOn" aria-hidden="true"><use href="#iEye" /></svg>
                    <svg class="icon eyeOff" aria-hidden="true"><use href="#iEyeOff" /></svg>
                  </button>
                </div>
                <div class="strength" data-level="0">
                  <span class="strengthBar"><i></i><i></i><i></i><i></i></span>
                  <span class="strengthText">Tối thiểu 8 ký tự, gồm chữ và số.</span>
                </div>
                <p id="newPasswordError" class="fieldError" hidden>
                  <svg class="icon iconSm" aria-hidden="true"><use href="#iAlert" /></svg>
                  <span></span>
                </p>
              </div>
              <div class="field">
                <label class="fieldLabel" for="newConfirm">Nhập lại mật khẩu mới</label>
                <div class="inputWrap">
                  <input id="newConfirm" class="input" type="password" required minlength="8" autocomplete="new-password" placeholder="Nhập lại mật khẩu" aria-describedby="newConfirmError">
                  <button type="button" class="eyeBtn" aria-controls="newConfirm" aria-pressed="false" aria-label="Hiện mật khẩu">
                    <svg class="icon eyeOn" aria-hidden="true"><use href="#iEye" /></svg>
                    <svg class="icon eyeOff" aria-hidden="true"><use href="#iEyeOff" /></svg>
                  </button>
                </div>
                <p id="newConfirmError" class="fieldError" hidden>
                  <svg class="icon iconSm" aria-hidden="true"><use href="#iAlert" /></svg>
                  <span></span>
                </p>
              </div>
              <button type="submit" class="btn btnPrimary btnBlock submitBtn">Cập nhật mật khẩu</button>
            </form>

            <p class="switchText">
              <a href="login.html" class="textLink">Quay lại đăng nhập</a>
            </p>
          </section>

          <aside class="authStub" aria-label="Hỗ trợ">
            <svg class="stubImage" viewBox="0 0 200 240" aria-hidden="true">
              <use href="#suitcase" style="--bodyColor:#27466F" />
            </svg>
            <h2 class="stubTitle">Mật khẩu an toàn</h2>
            <p class="stubText">Dùng ít nhất 8 ký tự, gồm chữ và số. Không dùng lại mật khẩu cũ.</p>
          </aside>
        </div>
      </div>
    </main>
    <site-footer></site-footer>
  </body>
</html>
